<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Customers - Telecom Admin</title>

    <link rel="stylesheet" href="../css/output.css">

</head>


<body class="bg-gray-100 min-h-screen">


    <!-- NAVBAR -->

    <nav class="bg-white border-b border-gray-200">

        <div
            class="max-w-7xl mx-auto px-6 py-4
                   flex justify-between items-center">

            <div class="flex items-center gap-3">

                <div
                    class="w-10 h-10 rounded-lg
                           bg-blue-600
                           flex items-center justify-center
                           text-white text-xl">

                    📡

                </div>

                <div>

                    <h1
                        class="text-xl font-bold
                               text-gray-800">

                        Telecom

                    </h1>

                    <p
                        class="text-xs text-gray-500">

                        Administration Portal

                    </p>

                </div>

            </div>


            <div class="flex items-center gap-4">

                <span
                    id="adminName"
                    class="text-sm font-medium
                           text-gray-700">

                    Administrator

                </span>

                <button
                    id="logoutButton"
                    class="px-4 py-2
                           text-sm font-medium
                           text-red-600
                           border border-red-200
                           rounded-lg
                           hover:bg-red-50">

                    Logout

                </button>

            </div>

        </div>

    </nav>



    <!-- MAIN -->

    <main
        class="max-w-7xl mx-auto
               px-6 py-8">


        <!-- HEADER -->

        <div
            class="flex flex-col
                   md:flex-row
                   md:items-center
                   md:justify-between
                   gap-4 mb-8">

            <div>

                <p
                    class="text-sm font-medium
                           text-blue-600">

                    ADMINISTRATION

                </p>

                <h2
                    class="text-3xl font-bold
                           text-gray-800 mt-1">

                    Customers

                </h2>

                <p
                    class="text-gray-500 mt-2">

                    View registered customer accounts.

                </p>

            </div>


            <a
                href="dashboard.html"
                class="px-4 py-2
                       bg-gray-800
                       text-white
                       rounded-lg
                       hover:bg-gray-900
                       transition">

                ← Dashboard

            </a>

        </div>



        <!-- MESSAGE -->

        <div
            id="message"
            class="hidden mb-6
                   p-4 rounded-lg">
        </div>



        <!-- CUSTOMER COUNT -->

        <div
            class="bg-white
                   rounded-xl
                   border border-gray-200
                   p-5 mb-6">

            <div class="flex items-center gap-4">

                <div
                    class="w-12 h-12
                           rounded-xl
                           bg-purple-100
                           flex items-center
                           justify-center
                           text-2xl">

                    👥

                </div>

                <div>

                    <p
                        class="text-sm
                               text-gray-500">

                        Registered Customers

                    </p>

                    <p
                        id="customerCount"
                        class="text-2xl
                               font-bold
                               text-gray-800">

                        0

                    </p>

                </div>

            </div>

        </div>



        <!-- CUSTOMER TABLE -->

        <div
            class="bg-white
                   rounded-2xl
                   border border-gray-200
                   overflow-hidden">


            <div
                class="px-6 py-5
                       border-b border-gray-200">

                <h3
                    class="text-lg
                           font-bold
                           text-gray-800">

                    Customer Details

                </h3>

            </div>


            <!-- Loading -->

            <div
                id="loading"
                class="p-10 text-center
                       text-gray-500">

                Loading customers...

            </div>


            <!-- Empty -->

            <div
                id="emptyState"
                class="hidden p-10
                       text-center">

                <div class="text-4xl mb-3">
                    👥
                </div>

                <p
                    class="font-semibold
                           text-gray-700">

                    No customers found

                </p>

                <p
                    class="text-sm
                           text-gray-500 mt-1">

                    Registered customers will
                    appear here.

                </p>

            </div>


            <!-- Table -->

            <div
                id="tableContainer"
                class="hidden overflow-x-auto">

                <table
                    class="w-full text-left">

                    <thead
                        class="bg-gray-50
                               border-b
                               border-gray-200">

                        <tr>

                            <th
                                class="px-6 py-4
                                       text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase">

                                ID

                            </th>

                            <th
                                class="px-6 py-4
                                       text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase">

                                Customer

                            </th>

                            <th
                                class="px-6 py-4
                                       text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase">

                                Email

                            </th>

                            <th
                                class="px-6 py-4
                                       text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase">

                                Phone

                            </th>

                            <th
                                class="px-6 py-4
                                       text-xs
                                       font-semibold
                                       text-gray-500
                                       uppercase">

                                Role

                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="customerTableBody"
                        class="divide-y
                               divide-gray-100">

                    </tbody>

                </table>

            </div>

        </div>


    </main>



    <script src="../js/api.js"></script>
    <script src="../js/admin-customers.js"></script>

</body>

</html>
