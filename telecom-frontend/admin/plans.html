<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Plan Management - Telecom</title>

    <link rel="stylesheet" href="../css/output.css">

</head>

<body class="bg-gray-100 min-h-screen">


<!-- ================= NAVBAR ================= -->

<nav class="bg-white shadow-sm">

    <div class="max-w-7xl mx-auto px-6 py-4
                flex justify-between items-center">

        <div>

            <h1 class="text-xl font-bold text-gray-800">
                Telecom
            </h1>

            <p class="text-xs text-gray-500">
                Plan Management
            </p>

        </div>


        <div class="flex items-center gap-6">

            <a
                href="dashboard.html"
                class="text-blue-600 hover:underline">

                Dashboard

            </a>


            <button
                id="logoutButton"
                class="text-red-600 font-medium">

                Logout

            </button>

        </div>

    </div>

</nav>



<!-- ================= MAIN ================= -->

<main class="max-w-7xl mx-auto px-6 py-8">


    <div>

        <h2 class="text-3xl font-bold text-gray-800">
            Plan Management
        </h2>

        <p class="text-gray-500 mt-2">
            Create and manage telecom recharge plans.
        </p>

    </div>



    <!-- ================= MESSAGE ================= -->

    <div
        id="message"
        class="hidden mt-6 p-4 rounded-lg">
    </div>



    <!-- ================= CREATE PLAN ================= -->

    <section
        class="mt-8 bg-white rounded-xl shadow p-6">

        <h3 class="text-xl font-semibold text-gray-800">

            Create New Plan

        </h3>

        <p class="text-sm text-gray-500 mt-1">

            Create a new recharge plan for customers.

        </p>


        <form
            id="createPlanForm"
            class="mt-6 grid grid-cols-1
                   md:grid-cols-2
                   lg:grid-cols-3 gap-5">


            <!-- PLAN NAME -->

            <div>

                <label
                    for="planName"
                    class="block text-sm font-medium
                           text-gray-700 mb-2">

                    Plan Name

                </label>

                <input
                    id="planName"
                    type="text"
                    required
                    maxlength="100"
                    placeholder="Prepaid Plus"
                    class="w-full border
                           border-gray-300
                           rounded-lg px-4 py-3
                           focus:ring-2
                           focus:ring-blue-500">

            </div>



            <!-- PRICE -->

            <div>

                <label
                    for="price"
                    class="block text-sm font-medium
                           text-gray-700 mb-2">

                    Price

                </label>

                <input
                    id="price"
                    type="number"
                    min="0.01"
                    step="0.01"
                    required
                    placeholder="299.00"
                    class="w-full border
                           border-gray-300
                           rounded-lg px-4 py-3">

            </div>



            <!-- VALIDITY -->

            <div>

                <label
                    for="validityDays"
                    class="block text-sm font-medium
                           text-gray-700 mb-2">

                    Validity (Days)

                </label>

                <input
                    id="validityDays"
                    type="number"
                    min="1"
                    required
                    placeholder="28"
                    class="w-full border
                           border-gray-300
                           rounded-lg px-4 py-3">

            </div>



            <!-- DATA -->

            <div>

                <label
                    for="dataLimitGbPerDay"
                    class="block text-sm font-medium
                           text-gray-700 mb-2">

                    Data / Day (GB)

                </label>

                <input
                    id="dataLimitGbPerDay"
                    type="number"
                    min="0"
                    step="0.01"
                    required
                    placeholder="2"
                    class="w-full border
                           border-gray-300
                           rounded-lg px-4 py-3">

            </div>



            <!-- TALKTIME -->

            <div>

                <label
                    for="talktimeMins"
                    class="block text-sm font-medium
                           text-gray-700 mb-2">

                    Talktime (Minutes)

                </label>

                <input
                    id="talktimeMins"
                    type="number"
                    min="0"
                    required
                    placeholder="200"
                    class="w-full border
                           border-gray-300
                           rounded-lg px-4 py-3">

            </div>


            <!-- SMS COUNT -->

            <div>

                <label
                    for="smsCount"
                    class="block text-sm font-medium
                           text-gray-700 mb-2">
            
                    SMS Count
            
                </label>
            
                <input
                    id="smsCount"
                    type="number"
                    min="0"
                    required
                    placeholder="100"
                    class="w-full border
                           border-gray-300
                           rounded-lg px-4 py-3">
            
            </div>

            
            <!-- PLAN TYPE -->

            <div>

                <label
                    for="planType"
                    class="block text-sm font-medium
                           text-gray-700 mb-2">
            
                    Plan Type
            
                </label>
            
                <select
                    id="planType"
                    required
                    class="w-full border
                           border-gray-300
                           rounded-lg px-4 py-3">
            
                    <option value="">
                        Select plan type
                    </option>
            
                    <option value="PREPAID">
                        Prepaid
                    </option>
            
                    <option value="POSTPAID">
                        Postpaid
                    </option>
            
                </select>
            
            </div>

            <!-- CREATE BUTTON -->

            <div class="flex items-end">

                <button
                    id="createPlanButton"
                    type="submit"
                    class="w-full
                           bg-blue-600
                           text-white
                           py-3
                           rounded-lg
                           font-semibold
                           hover:bg-blue-700">

                    Create Plan

                </button>

            </div>

        </form>

    </section>



    <!-- ================= PLANS ================= -->

    <section class="mt-10">


        <div
            class="flex justify-between
                   items-center mb-5">

            <div>

                <h3
                    class="text-xl font-semibold
                           text-gray-800">

                    All Plans

                </h3>

                <p
                    class="text-sm text-gray-500 mt-1">

                    Manage the plans available
                    in the telecom system.

                </p>

            </div>


            <button
                id="refreshPlansButton"
                class="border
                       border-gray-300
                       bg-white
                       px-4 py-2
                       rounded-lg
                       hover:bg-gray-50">

                Refresh

            </button>

        </div>



        <div
            id="plansContainer"
            class="grid grid-cols-1
                   md:grid-cols-2
                   lg:grid-cols-3
                   gap-6">

            <p class="text-gray-500">
                Loading plans...
            </p>

        </div>

    </section>


</main>



<script src="../js/api.js"></script>
<script src="../js/admin-plans.js"></script>

</body>

</html>
