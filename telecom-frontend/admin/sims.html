<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SIM Management - Telecom</title>

    <link rel="stylesheet" href="../css/output.css">

</head>

<body class="bg-gray-100 min-h-screen">


<nav class="bg-white shadow-sm">

    <div class="max-w-7xl mx-auto px-6 py-4
                flex justify-between items-center">

        <div>

            <h1 class="text-xl font-bold text-gray-800">
                Telecom Admin
            </h1>

            <p class="text-xs text-gray-500">
                SIM Management
            </p>

        </div>


        <div class="flex items-center gap-5">

            <a
                href="dashboard.html"
                class="text-blue-600 hover:underline">

                Dashboard

            </a>

            <button
                id="logoutButton"
                class="text-red-600 font-medium">

                Logout

            </button>

        </div>

    </div>

</nav>


<main class="max-w-7xl mx-auto px-6 py-8">


    <div class="flex justify-between items-center">

        <div>

            <h2 class="text-3xl font-bold text-gray-800">
                SIM Management
            </h2>

            <p class="text-gray-500 mt-2">
                Create SIM cards and manage activation requests.
            </p>

        </div>

    </div>


    <!-- Global message -->

    <div
        id="message"
        class="hidden mt-6 p-4 rounded-lg">
    </div>


    <!-- CREATE SIM -->

    <section class="mt-8 bg-white rounded-xl shadow p-6">

        <h3 class="text-xl font-semibold">
            Create New SIM
        </h3>

        <p class="text-sm text-gray-500 mt-1">
            New SIM cards will initially be marked as AVAILABLE.
        </p>


        <form
            id="createSimForm"
            class="mt-6 grid grid-cols-1 md:grid-cols-3
                   gap-4 items-end">


            <div>

                <label
                    for="phoneNumber"
                    class="block text-sm font-medium
                           text-gray-700 mb-2">

                    Phone Number

                </label>

                <input
                    id="phoneNumber"
                    type="text"
                    maxlength="10"
                    inputmode="numeric"
                    placeholder="9876543210"
                    required
                    class="w-full border rounded-lg
                           px-4 py-3">

            </div>


            <div>

                <label
                    for="imsiNumber"
                    class="block text-sm font-medium
                           text-gray-700 mb-2">

                    IMSI Number

                </label>

                <input
                    id="imsiNumber"
                    type="text"
                    maxlength="15"
                    inputmode="numeric"
                    placeholder="404XXXXXXXXXXX"
                    required
                    class="w-full border rounded-lg
                           px-4 py-3">

            </div>


            <button
                type="submit"
                id="createSimButton"
                class="bg-blue-600 text-white
                       py-3 px-6 rounded-lg
                       font-semibold hover:bg-blue-700">

                Create SIM

            </button>

        </form>

    </section>


    <!-- PENDING ACTIVATIONS -->

    <section class="mt-10">

        <div class="flex justify-between items-center mb-5">

            <div>

                <h3 class="text-xl font-semibold">
                    Pending Activation Requests
                </h3>

                <p class="text-sm text-gray-500 mt-1">
                    Review customer SIM activation requests.
                </p>

            </div>


            <button
                id="refreshPendingButton"
                class="border border-gray-300
                       bg-white px-4 py-2
                       rounded-lg hover:bg-gray-50">

                Refresh

            </button>

        </div>


        <div
            id="pendingSims"
            class="grid grid-cols-1 md:grid-cols-2
                   lg:grid-cols-3 gap-6">

            <p class="text-gray-500">
                Loading...
            </p>

        </div>

    </section>


</main>


<script src="../js/api.js"></script>
<script src="../js/admin-sims.js"></script>

</body>

</html>
