<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plans - Telecom</title>

    <link rel="stylesheet" href="../css/output.css">
</head>

<body class="bg-gray-100 min-h-screen">

<nav class="bg-white shadow-sm">

    <div class="max-w-7xl mx-auto px-6 py-4
                flex justify-between items-center">

        <div>
            <h1 class="text-xl font-bold text-gray-800">
                Telecom
            </h1>

            <p class="text-xs text-gray-500">
                Recharge Plans
            </p>
        </div>

        <div class="flex gap-4 items-center">

            <a
                href="dashboard.html"
                class="text-blue-600 hover:underline">
                Dashboard
            </a>

            <a
                href="subscriptions.html"
                class="text-blue-600 hover:underline">
                Subscriptions
            </a>

            <button
                id="logoutButton"
                class="text-red-600 font-medium">
                Logout
            </button>

        </div>

    </div>

</nav>


<main class="max-w-7xl mx-auto px-6 py-8">

    <h2 class="text-3xl font-bold text-gray-800">
        Available Plans
    </h2>

    <p class="text-gray-500 mt-2">
        Choose a plan and recharge your active SIM.
    </p>


    <div
        id="message"
        class="hidden mt-6 p-4 rounded-lg">
    </div>


    <div
        id="plansContainer"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3
               gap-6 mt-8">

        <p class="text-gray-500">
            Loading plans...
        </p>

    </div>

</main>


<!-- Recharge Modal -->

<div
    id="rechargeModal"
    class="hidden fixed inset-0 bg-black bg-opacity-50
           flex items-center justify-center px-4">

    <div class="bg-white rounded-xl shadow-xl
                w-full max-w-md p-6">

        <div class="flex justify-between items-center">

            <h3 class="text-xl font-bold">
                Recharge Plan
            </h3>

            <button
                onclick="closeRechargeModal()"
                class="text-gray-500 text-xl">
                ✕
            </button>

        </div>


        <div
            id="selectedPlan"
            class="mt-4 p-4 bg-gray-100 rounded-lg">
        </div>


        <div class="mt-5">

            <label class="block text-sm font-medium
                          text-gray-700 mb-2">

                Select Active SIM

            </label>

            <select
                id="simSelect"
                class="w-full border rounded-lg px-4 py-3">

                <option value="">
                    Loading SIMs...
                </option>

            </select>

        </div>


        <div class="mt-5">

            <label class="block text-sm font-medium
                          text-gray-700 mb-2">

                Payment Method

            </label>

            <select
                id="paymentMethod"
                class="w-full border rounded-lg px-4 py-3">

                <option value="UPI">
                    UPI
                </option>

                <option value="CARD">
                    Card
                </option>

                <option value="NET_BANKING">
                    Net Banking
                </option>

            </select>

        </div>


        <button
            id="confirmRechargeButton"
            class="w-full mt-6 bg-blue-600
                   text-white py-3 rounded-lg
                   font-semibold hover:bg-blue-700">

            Confirm Recharge

        </button>

    </div>

</div>


<script src="../js/api.js"></script>
<script src="../js/plans.js"></script>

</body>

</html>
