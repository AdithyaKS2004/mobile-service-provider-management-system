<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Telecom - Verify Email</title>

    <link rel="stylesheet" href="css/output.css">
</head>

<body
    class="min-h-screen bg-gray-100
           flex items-center justify-center">

    <div
        class="w-full max-w-md
               bg-white rounded-xl
               shadow-lg p-8">

        <!-- Header -->

        <div class="text-center mb-8">

            <h1
                class="text-3xl font-bold
                       text-gray-800">

                Telecom

            </h1>

            <p class="text-gray-500 mt-2">

                Verify your email address

            </p>

        </div>


        <!-- Information -->

        <div
            class="bg-blue-50
                   border border-blue-200
                   rounded-lg p-4 mb-6">

            <p class="text-sm text-blue-700">

                We have sent a 6-digit verification code
                to your email address.

            </p>

            <p
                id="emailDisplay"
                class="text-sm font-semibold
                       text-blue-800 mt-2
                       break-all">
            </p>

        </div>


        <!-- Verification Form -->

        <form id="verifyEmailForm">

            <div class="mb-6">

                <label
                    for="code"
                    class="block text-sm
                           font-medium
                           text-gray-700 mb-2">

                    Verification Code

                </label>

                <input
                    type="text"
                    id="code"
                    required
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="one-time-code"
                    class="w-full px-4 py-3
                           border rounded-lg
                           text-center
                           text-2xl
                           tracking-widest
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500"
                    placeholder="000000">

            </div>


            <!-- Message -->

            <div
                id="message"
                class="hidden mb-4 p-3
                       rounded-lg text-sm">

            </div>


            <!-- Verify -->

            <button
                type="submit"
                id="verifyButton"
                class="w-full
                       bg-blue-600
                       text-white py-3
                       rounded-lg
                       font-semibold
                       hover:bg-blue-700
                       transition">

                Verify Email

            </button>

        </form>


        <!-- Resend -->

        <button
            type="button"
            id="resendButton"
            class="w-full mt-3
                   border border-blue-600
                   text-blue-600 py-3
                   rounded-lg
                   font-semibold
                   hover:bg-blue-50
                   transition">

            Resend Code

        </button>


        <!-- Login -->

        <div class="text-center mt-6">

            <p class="text-gray-600">

                Already verified?

                <a
                    href="index.html"
                    class="text-blue-600
                           font-semibold
                           hover:underline">

                    Login

                </a>

            </p>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/verify-email.js"></script>

</body>

</html>
