<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Telecom - Register</title>

    <link rel="stylesheet" href="css/output.css">

</head>


<body
    class="min-h-screen bg-gray-100
           flex items-center justify-center">


    <div
        class="w-full max-w-md
               bg-white rounded-xl
               shadow-lg p-8">


        <!-- Header -->

        <div class="text-center mb-8">

            <h1
                class="text-3xl font-bold
                       text-gray-800">

                Telecom

            </h1>


            <p class="text-gray-500 mt-2">

                Create your customer account

            </p>

        </div>


        <!-- Registration Form -->

        <form id="registerForm">


            <!-- Full Name -->

            <div class="mb-4">

                <label
                    for="fullName"
                    class="block text-sm
                           font-medium
                           text-gray-700 mb-2">

                    Full Name

                </label>


                <input
                    type="text"
                    id="fullName"
                    required
                    minlength="2"
                    maxlength="100"
                    class="w-full px-4 py-3
                           border rounded-lg
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500"
                    placeholder="Enter your full name">

            </div>


            <!-- Email -->

            <div class="mb-4">

                <label
                    for="email"
                    class="block text-sm
                           font-medium
                           text-gray-700 mb-2">

                    Email

                </label>


                <input
                    type="email"
                    id="email"
                    required
                    class="w-full px-4 py-3
                           border rounded-lg
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500"
                    placeholder="Enter your email">

            </div>


            <!-- Phone -->

            <div class="mb-4">

                <label
                    for="phone"
                    class="block text-sm
                           font-medium
                           text-gray-700 mb-2">

                    Mobile Number

                </label>


                <input
                    type="tel"
                    id="phone"
                    required
                    maxlength="10"
                    minlength="10"
                    pattern="[6-9][0-9]{9}"
                    class="w-full px-4 py-3
                           border rounded-lg
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500"
                    placeholder="Enter 10-digit mobile number">

                <p
                    class="text-xs
                           text-gray-500 mt-1">

                    Enter a valid 10-digit
                    Indian mobile number.

                </p>

            </div>


            <!-- Password -->

            <div class="mb-4">

                <label
                    for="password"
                    class="block text-sm
                           font-medium
                           text-gray-700 mb-2">

                    Password

                </label>


                <input
                    type="password"
                    id="password"
                    required
                    minlength="8"
                    maxlength="100"
                    class="w-full px-4 py-3
                           border rounded-lg
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500"
                    placeholder="Enter password">

                <p
                    class="text-xs
                           text-gray-500 mt-1">

                    Password must contain at least
                    8 characters.

                </p>

            </div>


            <!-- Confirm Password -->

            <div class="mb-6">

                <label
                    for="confirmPassword"
                    class="block text-sm
                           font-medium
                           text-gray-700 mb-2">

                    Confirm Password

                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    required
                    minlength="8"
                    maxlength="100"
                    class="w-full px-4 py-3
                           border rounded-lg
                           focus:outline-none
                           focus:ring-2
                           focus:ring-blue-500"
                    placeholder="Confirm password">

            </div>


            <!-- Message -->

            <div
                id="message"
                class="hidden mb-4 p-3
                       rounded-lg text-sm">

            </div>


            <!-- Register -->

            <button
                type="submit"
                id="registerButton"
                class="w-full
                       bg-blue-600
                       text-white
                       py-3
                       rounded-lg
                       font-semibold
                       hover:bg-blue-700
                       transition">

                Create Account

            </button>


        </form>


        <!-- Login Link -->

        <div class="text-center mt-6">

            <p class="text-gray-600">

                Already have an account?

                <a
                    href="index.html"
                    class="text-blue-600
                           font-semibold
                           hover:underline">

                    Login

                </a>

            </p>

        </div>


    </div>


    <script src="js/api.js"></script>
    <script src="js/register.js"></script>

</body>

</html>
