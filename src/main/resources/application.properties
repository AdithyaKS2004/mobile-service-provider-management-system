spring.application.name=telecom

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/telecom}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}
#spring.jpa.defer-datasource-initialization=true


#SQL initialization
#spring.sql.init.mode=always

# Lazy initialization
spring.main.lazy-initialization=true


# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}


# Session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}